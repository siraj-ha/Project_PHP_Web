    <script>
      function escapeHtml(text) {
        const map = {
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#039;",
        };

        return String(text).replace(/[&<>"']/g, function (char) {
          return map[char];
        });
      }

      const dropdownMenu = document.querySelector(".dropdown-menu");

      if (dropdownMenu) {
        fetch("backend/auth_status.php", { cache: "no-store" })
          .then((response) => response.json())
          .then((data) => {
            if (data.logged_in) {
              const displayName = data.name || data.email || "Profile";

              dropdownMenu.innerHTML = `
                <li><a href="profile.php" class="login-btn">${escapeHtml(displayName)}</a></li>
                ${Number(data.is_admin) === 1 ? '<li><a href="panel.php" class="login-btn">Control Panel</a></li>' : ""}
                <li><a href="logout.php" class="signup-btn">Logout</a></li>
              `;
            } else {
              dropdownMenu.innerHTML = `
                <li><a href="login.php" class="login-btn">Login</a></li>
                <li><a href="signup.php" class="signup-btn">Sign Up</a></li>
              `;
            }
          })
          .catch(() => {
            dropdownMenu.innerHTML = `
              <li><a href="login.php" class="login-btn">Login</a></li>
              <li><a href="signup.php" class="signup-btn">Sign Up</a></li>
            `;
          });
      }

      // Close user menu when clicking outside
      document.addEventListener("click", function (event) {
        const userMenu = document.querySelector(".user-menu");
        const userToggle = document.querySelector("#user-toggle");

        if (userMenu && !userMenu.contains(event.target)) {
          if (userToggle) userToggle.checked = false;
        }
      });

      document
        .getElementById("reservation-form")
        .addEventListener("submit", function (e) {
          e.preventDefault();
          alert("Thank you! Your reservation request has been received.");
          window.location.href = "main.php";
        });
    </script>
