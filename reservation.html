<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reservation - Rengoku.tv</title>

    <!-- Fav Icon -->
    <link rel="shortcut icon" href="icon.ico" type="image/x-icon" />

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/swiper-bundle.min.css" />

    <!-- Box Icons -->
    <link
      href="https://cdn.boxicons.com/3.0.3/fonts/basic/boxicons.min.css"
      rel="stylesheet"
    />
  </head>

  <body>
    <!-- Header -->
    <header>
      <div class="nav container">
        <a href="Giyu.html" class="logo">Rengoku<span>.tv</span></a>

        <!-- User Menu -->
        <ul class="nav-menu">
          <li class="user-menu">
            <input type="checkbox" id="user-toggle" title="User menu toggle" />
            <label for="user-toggle" class="user-icon">
              <i class="bx bx-user-circle"></i>
              <i class="bx bxs-chevron-down"></i>
            </label>

            <ul class="dropdown-menu">
              <li><a href="login.html" class="login-btn">Login</a></li>
              <li><a href="signup.html" class="signup-btn">Sign Up</a></li>
            </ul>
          </li>
        </ul>
      </div>
    </header>

    <!-- Reservation Section -->
    <section class="banner">
      <h2>TAKE YOUR TICKETS NOW!</h2>
      <div class="card-container">
        <div class="card-img">
          <!-- image here -->
        </div>

        <div class="card-content">
          <h3>Reservation</h3>
          <form>
            <div class="form-row">
              <select name="days" title="Select Day">
                <option value="day-select">Select Day</option>
                <option value="sunday">Sunday</option>
                <option value="monday">Monday</option>
                <option value="tuesday">Tuesday</option>
                <option value="wednesday">Wednesday</option>
                <option value="thursday">Thursday</option>
                <option value="friday">Friday</option>
                <option value="saturday">Saturday</option>
              </select>

              <select name="hours" title="Select Hour">
                <option value="hour-select">Select Hour</option>
                <option value="10">10:00</option>
                <option value="14">14:00</option>
                <option value="16">16:00</option>
                <option value="20">20:00</option>
                <option value="22">22:00</option>
              </select>
            </div>

            <div class="form-row">
              <input type="text" placeholder="Full Name" required />
              <input type="text" placeholder="Phone Number" required />
            </div>

            <div class="form-row">
              <input
                type="number"
                placeholder="How Many Persons?"
                min="1"
                required
              />
              <input type="submit" value="TAKE TICKETS" />
            </div>
          </form>
        </div>
      </div>
    </section>

    <!-- Scripts -->
    <script src="js/swiper-bundle.min.js"></script>
    <script src="js/main.js"></script>
    <script>
      // Close user menu when clicking outside
      document.addEventListener("click", function (event) {
        const userMenu = document.querySelector(".user-menu");
        const userToggle = document.querySelector("#user-toggle");

        if (!userMenu.contains(event.target)) {
          userToggle.checked = false;
        }
      });
    </script>
  </body>
</html>
